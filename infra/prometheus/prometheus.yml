global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels: { env: local, system: agentic-rag }

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: agrag-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
        labels: { service: api }

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
        labels: { service: otel }

  - job_name: mcp-servers
    metrics_path: /metrics
    static_configs:
      - targets:
          - mcp-docs-search:8080
          - mcp-sql-analytics:8080
          - mcp-web-fetch:8080
          - mcp-calculator:8080
          - mcp-kg-query:8080
          - mcp-code-exec:8080
        labels: { service: mcp }

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
