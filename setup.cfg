# mutmut: mutation testing for the two modules held at 100% coverage.
#
# Coverage says a line ran. Mutation testing says an assertion would have
# noticed if it had been wrong. 100% coverage with a surviving mutant means a
# test that executes code and checks nothing about it — which is the failure
# mode 100% coverage most reliably hides.
#
#   mutmut run
#   mutmut results
#   mutmut show <id>
#
# Scoped to guardrails and fusion rather than the whole codebase: a full
# mutation run takes hours, and these are the two places where a silent
# behaviour change is a security or correctness bug rather than a latent one.

[mutmut]
paths_to_mutate = apps/api/src/guardrails/,apps/api/src/retrieval/fusion.py
tests_dir = apps/api/tests/unit/
runner = python -m pytest apps/api/tests/unit -x -q --no-cov
