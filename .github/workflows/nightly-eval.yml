# Nightly full eval, published to GitHub Pages.
#
# The pull-request gate runs the golden set. This runs everything, nightly, so
# the trend is visible over weeks — which is the only way to see the slow
# degradations that no single pull request is responsible for.
name: Nightly eval

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nightly-eval
  cancel-in-progress: false

jobs:
  preflight:
    name: Provider credentials
    runs-on: ubuntu-latest
    outputs:
      has_keys: ${{ steps.check.outputs.has_keys }}
    steps:
      # The `secrets` context is not available in a job-level `if`, so the
      # check has to happen in a job and reach the others through an output.
      - id: check
        env:
          ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC" ] || [ -n "$OPENAI" ]; then
            echo "has_keys=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keys=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skipped::No provider API key is configured for this repository, so the jobs that call a model cannot run. Add ANTHROPIC_API_KEY or OPENAI_API_KEY under Settings -> Secrets to enable them."
          fi

  run:
    runs-on: ubuntu-latest
    needs: preflight
    # Every set calls a model. Without a key this is skipped, not failed.
    if: needs.preflight.outputs.has_keys == 'true'
    timeout-minutes: 120
    strategy:
      # Not fail-fast: if the golden set fails, the adversarial result is still
      # worth having, and often says why.
      fail-fast: false
      matrix:
        set: [golden, regression, adversarial]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agrag
          POSTGRES_PASSWORD: agrag
          POSTGRES_DB: agrag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agrag"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      AGRAG_DATABASE_URL: postgresql+asyncpg://agrag:agrag@localhost:5432/agrag
      AGRAG_DATABASE_URL_SYNC: postgresql+psycopg://agrag:agrag@localhost:5432/agrag
      AGRAG_REDIS_URL: redis://localhost:6379/0
      AGRAG_MINIO_ENDPOINT: localhost:4566
      AGRAG_MINIO_ACCESS_KEY: test
      AGRAG_MINIO_SECRET_KEY: test
      AGRAG_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AGRAG_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "apps/api[dev]"
      - name: Start an S3-compatible object store
        # LocalStack, not MinIO. MinIO's images are no longer publicly
        # pullable from either registry -- Docker Hub answers "pull access
        # denied for minio/minio" and quay.io answers 401, so every job that
        # started one has been failing at this step regardless of what came
        # after it. There is no tag to re-pin to; the distribution itself
        # changed.
        #
        # LocalStack serves the same S3 API on 4566 and is public. Unverified
        # end to end, because the job it belongs to cannot run without a
        # provider key -- see the preflight job.
        run: |
          docker run -d --name s3 -p 4566:4566 -e SERVICES=s3 localstack/localstack:3
          for _ in $(seq 1 45); do
            curl -sf http://localhost:4566/_localstack/health && break
            sleep 2
          done
          curl -sf http://localhost:4566/_localstack/health
      - working-directory: apps/api
        run: alembic upgrade head
      - run: python scripts/seed_demo_tenant.py --wait-for-index
      - name: Start the API
        run: |
          (cd apps/api && uvicorn src.main:app --port 8000 --log-level warning &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/readyz >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8000/readyz
      - name: Run the set
        run: python -m evals.run --set ${{ matrix.set }} --enforce-size
        env:
          AGRAG_API_URL: http://localhost:8000
          AGRAG_API_KEY: ${{ secrets.AGRAG_DEMO_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.set }}
          path: evals/reports/

  publish:
    name: Publish to Pages
    needs: [preflight, run]
    # Published even when a set failed: a failing nightly is exactly the report
    # someone needs to read, and hiding it is the opposite of useful. But there
    # is nothing to publish when the sets never ran, and deploy-pages fails on
    # an empty artifact rather than no-opping.
    if: always() && needs.preflight.outputs.has_keys == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: reports
          merge-multiple: true
      - name: Build the index page
        run: python scripts/build_eval_index.py reports site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
