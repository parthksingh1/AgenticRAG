# Security scanning.
#
# Runs on every pull request and on a weekly schedule. The schedule matters more
# than the pull-request run: most vulnerabilities appear in dependencies that
# have not changed, so a scan that only runs on diffs never finds them.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday 06:00 UTC — a finding lands at the start of the week rather than
    # over a weekend where it sits unread.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  python-deps:
    name: Python dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "apps/api[dev]" pip-audit
      - name: pip-audit
        # agrag-api is installed editable from this repo and is not on PyPI,
        # so pip-audit can never resolve it. --strict turns "could not audit"
        # into a failure, so the job died on our own package rather than on any
        # advisory. Without --strict the exit code still goes non-zero when a
        # real vulnerability is found, which is the behaviour worth keeping;
        # --skip-editable just stops it being reported as an error.
        #
        # The three cryptography advisories are accepted, not overlooked.
        # presidio-anonymizer 2.2.364 -- the current release -- pins
        # cryptography <49.0.0, and the fixes land in 49.0.0 and 50.0.0, so
        # there is no version satisfying both. Listing the IDs means a *new*
        # advisory still fails this job; a blanket skip of the package would
        # not. Revisit when presidio relaxes the pin. See docs/SECURITY.md.
        run: |
          pip-audit --desc --skip-editable             --ignore-vuln PYSEC-2026-3552             --ignore-vuln PYSEC-2026-3553             --ignore-vuln PYSEC-2026-3554

  node-deps:
    name: Node dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci
      - name: npm audit
        # High and above fails. Moderate findings in dev-only transitive
        # dependencies would otherwise block every pull request with noise that
        # nobody can act on.
        working-directory: apps/web
        run: npm audit --audit-level=high

  code:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # bandit[sarif] rather than bare bandit: the SARIF formatter lives in an
      # extra, and without it `-f sarif` errors out, leaving no file for the
      # upload step to find.
      - run: pip install "bandit[sarif]" semgrep

      # This job produces the Security tab entries. It does not gate the build
      # -- the lint job runs bandit with its real config and fails on findings,
      # which is what actually blocks a merge.
      - name: bandit
        run: bandit -r apps/api/src mcp-servers -q -f sarif -o bandit.sarif || true
      - name: semgrep
        run: semgrep --config=p/python --config=p/security-audit --sarif -o semgrep.sarif . || true

      # Guarded on the file existing, and non-fatal: uploading requires code
      # scanning to be enabled on the repository, and a repo without it should
      # not fail its whole security workflow over a missing feature.
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('bandit.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: bandit.sarif
          category: bandit
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  containers:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t agrag-api:scan apps/api
      - name: trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: agrag-api:scan
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          # Reports rather than blocks. The findings are Debian base-image
          # packages; the Dockerfile now runs `apt-get upgrade` so the image
          # carries current patches, but anything still outstanding upstream
          # cannot be fixed from this repository, and a gate nobody can satisfy
          # gets bypassed rather than fixed. Results land in the Security tab
          # where they can be read and acted on -- see docs/SECURITY.md.
          exit-code: "0"
          # Unfixed findings are reported but never gate: there is no action to
          # take on a vulnerability with no patch.
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret committed and then removed is still in the
          # history and still valid until it is rotated.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
