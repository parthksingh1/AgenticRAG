[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agrag-api"
version = "0.1.0"
description = "AgenticRAG — multi-tenant agentic RAG platform API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
  # web
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "python-multipart>=0.0.10",
  "sse-starlette>=2.1.3",
  "websockets>=13.1",
  # config & validation
  "pydantic>=2.9.2",
  "pydantic-settings>=2.5.2",
  "email-validator>=2.2.0",
  # data
  "sqlalchemy[asyncio]>=2.0.35",
  "alembic>=1.13.3",
  "asyncpg>=0.29.0",
  "psycopg[binary]>=3.2.2",
  "pgvector>=0.3.5",
  "redis>=5.1.0",
  "opensearch-py>=2.7.1",
  "minio>=7.2.9",
  "neo4j>=5.25.0",
  "celery[redis]>=5.4.0",
  # llm & rag
  "langgraph>=0.2.35",
  "langchain-core>=0.3.9",
  "openai>=1.51.0",
  "anthropic>=0.36.0",
  "google-genai>=0.3.0",
  "cohere>=5.11.0",
  "tiktoken>=0.8.0",
  "tenacity>=9.0.0",
  "httpx>=0.27.2",
  "mcp>=1.1.0",
  "jinja2>=3.1.4",
  "pyyaml>=6.0.2",
  # ml
  "sentence-transformers>=3.1.1",
  "torch>=2.4.1",
  "numpy>=1.26.4",
  "scikit-learn>=1.5.2",
  "datasketch>=1.6.5",
  # ingestion
  "pymupdf>=1.24.10",
  "python-docx>=1.1.2",
  "python-pptx>=1.0.2",
  "trafilatura>=1.12.2",
  "pytesseract>=0.3.13",
  "pillow>=10.4.0",
  "pandas>=2.2.3",
  "openpyxl>=3.1.5",
  "markdownify>=0.13.1",
  # guardrails
  "presidio-analyzer>=2.2.355",
  "presidio-anonymizer>=2.2.355",
  # tools
  "sympy>=1.13.3",
  "python-dateutil>=2.9.0",
  "pint>=0.24.3",
  "sqlparse>=0.5.1",
  "RestrictedPython>=7.3",
  # observability
  "loguru>=0.7.2",
  "langfuse>=2.51.5",
  "prometheus-client>=0.21.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
  "opentelemetry-instrumentation-redis>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
  "opentelemetry-instrumentation-celery>=0.48b0",
  # auth
  "pyjwt[crypto]>=2.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  "hypothesis>=6.112.2",
  "testcontainers[postgres,redis,opensearch]>=4.8.2",
  "schemathesis>=3.36.0",
  # tests/conftest.py runs the unit suite against sqlite+aiosqlite in memory.
  "aiosqlite>=0.20.0",
  "respx>=0.21.1",
  "ruff>=0.6.9",
  "mypy>=1.11.2",
  "bandit[toml]>=1.7.10",
  "pip-audit>=2.7.3",
  "mutmut>=2.5.1",
  "types-PyYAML",
  "types-python-dateutil",
]
evals = [
  "ragas>=0.2.1",
  "datasets>=3.0.1",
  "scipy>=1.14.1",
  "matplotlib>=3.9.2",
  "rich>=13.9.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # bugbear
  "BLE",       # no bare `except Exception` without justification
  "C4",        # comprehensions
  "SIM",       # simplify
  "ASYNC",     # async correctness
  "S",         # bandit-style security
  "T20",       # no print()
  "RET",       # return simplification
  "PTH",       # use pathlib
  "ANN",       # type annotations
  "D",         # docstrings
  "RUF",
]
ignore = [
  "D203",   # conflicts with D211
  "D213",   # conflicts with D212
  "ANN101", # annotating `self` adds noise, no signal (deprecated upstream)
  "ANN102", # ditto for `cls`
  "ANN401", # Any is occasionally the honest type at provider boundaries
  "S101",   # assert — allowed, tests are checked separately
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S105", "S106", "S311"]
"alembic/**" = ["D", "ANN", "E501"]
"src/models/**" = ["D106"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() defaults are the documented idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header", "fastapi.Body", "fastapi.File", "fastapi.Form"]

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/", "^build/"]

[[tool.mypy.overrides]]
module = [
  "presidio_analyzer.*", "presidio_anonymizer.*", "sentence_transformers.*",
  "datasketch.*", "trafilatura.*", "pytesseract.*", "fitz.*", "pptx.*",
  "docx.*", "opensearchpy.*", "minio.*", "langfuse.*", "ragas.*",
  "langgraph.*", "pgvector.*", "RestrictedPython.*", "sqlparse.*", "pint.*",
  "neo4j.*", "openpyxl.*", "cohere.*", "PIL.*", "opentelemetry.exporter.*",
  "opentelemetry.instrumentation.*", "opentelemetry.sdk.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# celery ships no py.typed marker and no third-party stub package exists.
# ignore_missing_imports silences the import error; the decorator check below
# is silenced separately, because celery's task decorator returning Any is the
# root cause of every "makes X untyped" warning in this module and there is no
# fix available on our side of that boundary.
module = ["celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.workers.celery_app"]
disallow_untyped_decorators = false

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: fast, no external dependencies",
  "integration: requires testcontainers (Docker)",
  "e2e: full stack",
  "chaos: fault injection",
  "contract: schemathesis contract tests against the OpenAPI schema",
  "slow: takes >5s",
]
# Doctests are documentation first: ELLIPSIS lets an example show the shape of
# a value (an id, a hash, a traceback) without pinning it to one run.
doctest_optionflags = ["ELLIPSIS", "NORMALIZE_WHITESPACE", "IGNORE_EXCEPTION_DETAIL"]
filterwarnings = ["error::DeprecationWarning:src.*"]

# ── coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/main.py", "*/__init__.py", "src/workers/celery_app.py"]

[tool.coverage.report]
# The measured floor, not an aspiration. Actual coverage is 66% and the
# target is 85%; setting the gate to 85 while the suite sits at 66 fails
# every build and gets the gate deleted rather than the tests written.
# The gap is concentrated in the I/O-heavy modules that need fakes:
# storage.py (35%), services/ingestion.py (35%), llm/providers.py (36%),
# webhooks.py (40%). Raise this as those come up.
#
# Note the separate 100% line-and-branch gate on src/guardrails and
# src/retrieval/fusion.py, enforced as its own CI step. That one passes.
fail_under = 65
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  '@(abc\.)?abstractmethod',
  '\.\.\.',
]

# ── bandit ────────────────────────────────────────────────────────────────────
[tool.bandit]
exclude_dirs = ["tests", "alembic"]
# B101 assert_used is handled by ruff's S101 per-file config.
skips = ["B101"]
