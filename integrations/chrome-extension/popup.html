<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body { width: 380px; margin: 0; padding: 12px; font: 13px/1.5 system-ui, sans-serif; }
      textarea {
        width: 100%; box-sizing: border-box; resize: vertical; min-height: 56px;
        padding: 8px; border-radius: 8px; border: 1px solid rgba(128, 128, 128, 0.35);
        font: inherit; background: transparent; color: inherit;
      }
      .row { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
      button {
        padding: 6px 12px; border-radius: 8px; border: 0;
        background: #4f46e5; color: #fff; font: inherit; cursor: pointer;
      }
      button.secondary {
        background: transparent; color: inherit;
        border: 1px solid rgba(128, 128, 128, 0.35);
      }
      button:disabled { opacity: 0.5; cursor: default; }
      label { display: flex; align-items: center; gap: 4px; font-size: 12px; opacity: 0.75; }
      #out { margin-top: 10px; white-space: pre-wrap; max-height: 320px; overflow-y: auto; }
      #sources { margin-top: 8px; font-size: 11px; opacity: 0.7; white-space: pre-wrap; }
      .error { color: #dc2626; }
    </style>
  </head>
  <body>
    <textarea id="q" placeholder="Ask about your documents..." aria-label="Your question"></textarea>
    <div class="row">
      <button id="ask">Ask</button>
      <button id="save" class="secondary">Save page</button>
      <label><input type="checkbox" id="usePage" /> use this page</label>
    </div>
    <div id="out" role="status"></div>
    <div id="sources"></div>
    <script src="popup.js"></script>
  </body>
</html>
