default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^infra/helm/.*/templates/
      - id: check-json
        exclude: ^(apps/web/tsconfig.json|.*\.code-workspace)$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^(apps/api/src|mcp-servers)/
        additional_dependencies:
          - pydantic>=2.9
          - pydantic-settings>=2.5
          - types-PyYAML
          - types-python-dateutil
        args: [--config-file=apps/api/pyproject.toml]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: [-q, -c, apps/api/pyproject.toml]
        files: ^(apps/api/src|mcp-servers)/
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/semgrep/semgrep
    rev: v1.90.0
    hooks:
      - id: semgrep
        args: [--config, p/python, --config, p/security-audit, --error, --skip-unknown-extensions]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.19.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: frontend-lint
        name: eslint + prettier (apps/web)
        entry: bash -c 'cd apps/web && pnpm exec eslint --max-warnings 0 $(echo "$@" | tr " " "\n" | sed "s|apps/web/||")' --
        language: system
        files: ^apps/web/.*\.(ts|tsx)$
        pass_filenames: true
